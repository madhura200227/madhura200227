<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="divFadeLeft_ch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D60" stop-opacity="0" />
      <stop offset="50%" stop-color="#C1123F" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF2D60" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="divFadeRight_ch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D60" stop-opacity="1" />
      <stop offset="50%" stop-color="#C1123F" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF2D60" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Tapered Line (Rich Cherry Accent) -->
  <line x1="60" y1="12" x2="420" y2="12" stroke="url(#divFadeLeft_ch)" stroke-width="1.3" />

  <!-- Right Tapered Line (Rich Cherry Accent) -->
  <line x1="480" y1="12" x2="840" y2="12" stroke="url(#divFadeRight_ch)" stroke-width="1.3" />

  <!-- Flanking Champagne Accent Dots -->
  <circle cx="410" cy="12" r="1.8" fill="#E8D5C5" />
  <circle cx="490" cy="12" r="1.8" fill="#E8D5C5" />

  <!-- Center Decorative Diamond Emblem -->
  <circle cx="450" cy="12" r="9.5" fill="#780e2b" fill-opacity="0.6" stroke="#FF2D60" stroke-width="1.3" />
  <polygon points="450,4.5 456.5,12 450,19.5 443.5,12" fill="#FF2D60" />
  <polygon points="450,7.5 453.5,12 450,16.5 446.5,12" fill="#FFF5ED" />
</svg>

