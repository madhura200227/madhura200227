<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 201 36" width="201" height="36">
  <defs>
    <filter id="pvGlow_espresso" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3.5" flood-color="#C1123F" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Luxury Pill Container -->
  <rect x="0.6" y="0.6" width="199.8" height="34.8" rx="17.4" fill="#181011" stroke="#873D50" stroke-width="1.2" filter="url(#pvGlow_espresso)" />

  <!-- Left Side: Vector Eye Icon & Label -->
  <g transform="translate(18, 18)">
    <!-- Eye Vector Icon -->
    <path d="M -8 0 Q 0 -5.5 8 0 Q 0 5.5 -8 0 Z" fill="none" stroke="#C1123F" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.2" fill="#C1123F" />
    <!-- Label -->
    <text x="14" y="3.5" font-family="'IBM Plex Mono', 'SF Mono', monospace" font-size="10.5" font-weight="600" fill="#E8D5C5" letter-spacing="1.2">PROFILE VIEWS</text>
  </g>

  <!-- Right Side Counter Capsule -->
  <g transform="translate(141, 3.5)">
    <rect x="0" y="0" width="56" height="27" rx="13.5" fill="#C1123F" />
    <text x="28.0" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">211</text>
  </g>
</svg>